<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitas · edumr.es</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f4f7f5">
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="stylesheet" href="/futmondo/stats/stats.css?v=1">
</head>
<body>
  <main>
    <header class="st-head">
      <h1>Visitas</h1>
      <p>Contador propio, sin cookies. Una visita por página y sesión.</p>
    </header>
    <section class="st-card">
      <div class="st-row st-total">
        <span>Últimos 14 días</span>
        <b id="stTotal">—</b>
      </div>
      <div id="stDays" class="st-days"></div>
    </section>
    <section class="st-card">
      <h2>Páginas más vistas</h2>
      <div id="stPages" class="st-pages"></div>
    </section>
    <p class="st-foot">Datos guardados en Cloudflare (KV). <a href="/futmondo/">Volver</a></p>
  </main>
  <script src="/futmondo/stats/stats.js?v=1"></script>
</body>
</html>
