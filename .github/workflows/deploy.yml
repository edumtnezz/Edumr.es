name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pruebas (si fallan, NO se publica nada)
        run: |
          node --test tests/*.test.mjs
          node --check futmondo/alineacion.js
          node --check futmondo/guiafantasy/mercado.js
          cp "functions/api/laquiniela/[[path]].js" /tmp/backend.mjs && node --check /tmp/backend.mjs

      - name: Preparar dist
        run: bash build.sh

      - name: Publicar web (Cloudflare Pages)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=edumr --branch=main

      - name: Publicar Worker de La Puja (Durable Object)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: puja-do
          command: deploy

      - name: Publicar agente Cron (noticias 24h)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cron
          command: deploy

      # Al final, se comprueba de verdad la web publicada. Si algo se ha quedado
      # roto (página en blanco, API vacía), el despliegue sale en rojo y se ve.
      - name: Comprobar que la web sigue en pie
        run: node scripts/smoke.mjs
