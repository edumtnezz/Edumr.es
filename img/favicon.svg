<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1024"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>
    <linearGradient id="neonG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glowF">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Icon -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgG)"/>
  <rect x="4" y="4" width="120" height="120" rx="32" fill="none" stroke="url(#neonG)" stroke-width="5"/>

  <!-- Stylized Geometric "E" -->
  <g filter="url(#glowF)" fill="url(#neonG)">
    <!-- Vertical Spine -->
    <rect x="36" y="32" width="16" height="64" rx="8"/>
    <!-- Top Bar -->
    <rect x="44" y="32" width="48" height="14" rx="7"/>
    <!-- Middle Bar (Stylized & Shorter) -->
    <rect x="44" y="57" width="36" height="14" rx="7"/>
    <!-- Bottom Bar -->
    <rect x="44" y="82" width="48" height="14" rx="7"/>
    <!-- Small Cyber Sparkle Accent -->
    <circle cx="92" cy="64" r="5" fill="#00f2fe"/>
  </g>
</svg>
