<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 242, 254, 0.6)"/>
      <stop offset="50%" stop-color="rgba(139, 92, 246, 0.4)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.1)"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base (App Icon Style) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#geminiGrad)" opacity="0.18" filter="url(#softGlow)"/>

  <!-- Globe / Grid Lines (Subtle Infrastructure) -->
  <g stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" fill="none">
    <circle cx="256" cy="256" r="140"/>
    <ellipse cx="256" cy="256" rx="140" ry="60"/>
    <line x1="116" y1="256" x2="396" y2="256"/>
    <line x1="256" y1="116" x2="256" y2="396"/>
  </g>

  <!-- Server / VPS Tower Node Base -->
  <g filter="url(#glow)">
    <!-- Server Stack Layers -->
    <!-- Layer 3 (Bottom) -->
    <rect x="156" y="320" width="200" height="34" rx="10" fill="#131e3b" stroke="url(#geminiGrad)" stroke-width="2.5"/>
    <circle cx="184" cy="337" r="4" fill="#00f2fe"/>
    <circle cx="204" cy="337" r="4" fill="#38bdf8"/>
    <rect x="290" y="333" width="44" height="8" rx="4" fill="rgba(0, 242, 254, 0.3)"/>

    <!-- Layer 2 (Middle) -->
    <rect x="156" y="272" width="200" height="34" rx="10" fill="#131e3b" stroke="url(#geminiGrad)" stroke-width="2.5"/>
    <circle cx="184" cy="289" r="4" fill="#10b981"/>
    <circle cx="204" cy="289" r="4" fill="#38bdf8"/>
    <rect x="290" y="285" width="44" height="8" rx="4" fill="rgba(16, 185, 129, 0.3)"/>

    <!-- Layer 1 (Top) -->
    <rect x="156" y="224" width="200" height="34" rx="10" fill="#131e3b" stroke="url(#geminiGrad)" stroke-width="2.5"/>
    <circle cx="184" cy="241" r="4" fill="#a855f7"/>
    <circle cx="204" cy="241" r="4" fill="#38bdf8"/>
    <rect x="290" y="237" width="44" height="8" rx="4" fill="rgba(168, 85, 247, 0.3)"/>
  </g>

  <!-- Gemini Sparkle Star (Top Floating) -->
  <g filter="url(#glow)">
    <!-- Main 4-pointed sparkle -->
    <path d="M 256,92 Q 256,156 320,156 Q 256,156 256,220 Q 256,156 192,156 Q 256,156 256,92 Z" fill="url(#geminiGrad)"/>
    <!-- Small secondary sparkle -->
    <path d="M 338,110 Q 338,130 358,130 Q 338,130 338,150 Q 338,130 318,130 Q 338,130 338,110 Z" fill="url(#purpleGrad)"/>
  </g>

  <!-- Stylized Branding Badge at bottom: edumr.es -->
  <g>
    <rect x="180" y="382" width="152" height="32" rx="16" fill="rgba(0, 242, 254, 0.08)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5"/>
    <text x="256" y="403" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9" letter-spacing="1">
      edumr<tspan fill="#00f2fe">.es</tspan>
    </text>
  </g>
</svg>
